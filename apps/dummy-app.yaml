# root Application(App of Apps)이 이 파일을 읽어 dummy-app Application을 만든다.
# 실제 매니페스트는 workloads/dummy-app/ (apps/ 밖에 둬야 root가 중복으로 읽지 않는다).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dummy-app
  namespace: argocd
spec:
  project: ops-platform
  source:
    repoURL: https://github.com/hrlee-okestro/ops-platform-manifests.git
    targetRevision: main
    path: workloads/dummy-app
  destination:
    server: https://kubernetes.default.svc
    namespace: ops-platform
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
