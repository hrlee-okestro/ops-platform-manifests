# dummy-app: 장애 주입용 Spring Boot 앱. 이미지 태그는 kustomization.yaml의 images에서 관리한다 (CI가 갱신).
#
# 배치: 우리 워크로드는 preferred nodeAffinity로 node-3에 모은다 (docs/adr/0001 참고).
#   노드 호스트명을 이 공개 저장소에 쓰는 것은 사용자가 허용했다 (2026-11-06).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-app
  namespace: ops-platform
  labels:
    app.kubernetes.io/name: dummy-app
    app.kubernetes.io/part-of: ops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dummy-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dummy-app
        app.kubernetes.io/part-of: ops-platform
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["kwon-master-3"]
      containers:
        - name: dummy-app
          image: ghcr.io/hrlee-okestro/dummy-app
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
