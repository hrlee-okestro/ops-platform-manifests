# dummy-app: 장애 주입용 Spring Boot 앱. 이미지 태그는 kustomization.yaml의 images에서 관리한다 (CI가 갱신).
#
# 배치: 이 워크로드는 메모리 limit이 작아(256Mi) preferred nodeAffinity를 두지 않는다.
#   노드 호스트명은 공개 저장소에 쓰지 않는 규칙이라 Git에 넣을 수 없기 때문이다 (docs/adr/0001 참고).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-app
  namespace: ops-platform
  labels:
    app.kubernetes.io/name: dummy-app
    app.kubernetes.io/part-of: ops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dummy-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dummy-app
        app.kubernetes.io/part-of: ops-platform
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dummy-app
          image: ghcr.io/hrlee-okestro/dummy-app
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
