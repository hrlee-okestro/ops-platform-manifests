# ops-platform이 사용하는 전용 네임스페이스 (argocd, monitoring).
#
# - 사용자가 admin 권한으로 직접 적용한다 (Claude는 적용하지 않는다).
# - Namespace는 클러스터 범위 리소스다. 내용을 확인하고 승인한 뒤 적용한다.
# - ArgoCD가 관리하지 않는 부트스트랩 리소스다. Application이 이 디렉토리를 가리키게 하지 않는다.
#   (argocd 네임스페이스는 ArgoCD 설치보다 먼저 있어야 하므로 ArgoCD가 스스로 만들 수 없다.)
# - ops-platform 네임스페이스는 claude-readonly-rbac.yaml에서 이미 정의/생성되어 있어 여기에 두지 않는다.
# - Istio sidecar injection 라벨(istio-injection)을 붙이지 않는다.
#
# 적용 방법 (맥에서 직접 apply하지 않고 deploy 서버로 파이프한다):
#   0) 대상 클러스터 확인:  ssh root@<deploy-ip> 'kubectl get nodes'
#   1) 변경 미리보기:       ssh root@<deploy-ip> 'kubectl diff -f -' < bootstrap/namespaces.yaml
#   2) 서버 검증(적용 안 됨): ssh root@<deploy-ip> 'kubectl apply --dry-run=server -f -' < bootstrap/namespaces.yaml
#   3) 적용:                ssh root@<deploy-ip> 'kubectl apply -f -' < bootstrap/namespaces.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/part-of: ops-platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: ops-platform
